[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelclaw"
version = "0.1.0"
description = "Local defensive cybersecurity analysis CLI with optional local AI assistance."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "SentinelClaw Contributors" }
]

dependencies = [
    "psutil>=6.0.0",
    "pywin32>=311; platform_system == 'Windows'",
    "PyYAML>=6.0.2",
    "regex>=2024.5.15",
]

[project.optional-dependencies]
pcap = [
    "scapy>=2.6.0",
]

evtx = [
    "python-evtx>=0.8.0",
]

yara = [
    "yara-python>=4.5.0",
]

dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest-cov>=5.0.0",
]

# Build-time tooling for standalone binaries (P6-29). PyInstaller is not
# a runtime dependency; only the packaging scripts / CI build job need it.
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
sentinelclaw = "sentinelclaw.main:main"

[project.entry-points."sentinelclaw.detectors"]
sample = "sentinelclaw.plugins.sample_detector"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinelclaw*"]

[tool.setuptools.package-data]
sentinelclaw = [
    "rules/*.yaml",
    "rules/sigma/*.yaml",
    "rules/yara/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

# Linting is intentionally pragmatic: only error classes that catch real bugs
# (syntax/logic errors E4/E7/E9, undefined names and unused imports F) plus
# permissively long lines. The repo deliberately wraps multi-line calls well
# past 88 columns; the formatter ("ruff format") is not enforced here.
[tool.ruff]
line-length = 100
exclude = ["venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["sentinelclaw"]
# psutil, PyYAML, scapy and pywin32 ship no type stubs.
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false

[tool.coverage.run]
source = ["sentinelclaw"]
branch = true
